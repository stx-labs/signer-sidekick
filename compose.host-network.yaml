# Linux host-networking overlay. Requires Docker Compose v2.24.4 or newer.
services:
  sidekick:
    network_mode: host
    ports: !reset []
    environment:
      SIDEKICK_HTTP_HOST: ${SIDEKICK_HTTP_HOST:-127.0.0.1}
      SIDEKICK_HTTP_PORT: ${SIDEKICK_HTTP_PORT:-3998}
      SIDEKICK_EVENT_HTTP_HOST: ${SIDEKICK_EVENT_HTTP_HOST:-127.0.0.1}
    healthcheck:
      test:
        ["CMD", "node", "-e", "const host = process.env.SIDEKICK_HTTP_HOST || '127.0.0.1'; const port = process.env.SIDEKICK_HTTP_PORT || '3998'; fetch('http://' + host + ':' + port + '/health/live').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
