name: Test image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.image.outputs.commit }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Require green main CI and identify the test build
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "Test images must be dispatched from main." >&2
            exit 1
          }
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq length)"
          [[ "$passed" == 1 ]] || {
            echo "Wait for successful main CI for $GITHUB_SHA, then dispatch again." >&2
            exit 1
          }
          image="$(printf '%s' "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            VCS_REF=${{ needs.prepare.outputs.commit }}
            VERSION=test-${{ needs.prepare.outputs.commit }}
          context: .
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          target: runtime

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Download image digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: test-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Publish and verify the test tag
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          # Derive this here so even a publish-only retry receives a new tag.
          TAG="test-${COMMIT:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          images=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            images+=("$IMAGE@sha256:$(basename "$digest")")
          done
          [[ "${#images[@]}" -eq 2 ]] || {
            echo "Expected two architecture digests; found ${#images[@]}" >&2
            exit 1
          }
          reference="$IMAGE:$TAG"
          docker buildx imagetools create --tag "$reference" "${images[@]}"
          manifest="$(docker buildx imagetools inspect --raw "$reference")"
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' \
            <<<"$manifest" >/dev/null
          docker buildx imagetools inspect "$reference"
          {
            printf '## Test image (not a release)\n\n'
            printf 'Source commit: `%s`\n\n' "$COMMIT"
            printf '```sh\ndocker pull %s\n```\n\n' "$reference"
            printf 'Compose: set `SIDEKICK_IMAGE_TAG=%s` in `.env`.\n\n' "$TAG"
            printf 'Back up the database, gas key, and configuration before upgrading. Older images may require restoring the matching database backup.\n'
          } >> "$GITHUB_STEP_SUMMARY"
