name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned protocol sources
        run: pnpm protocol:verify

      - name: Verify Devnet version lock
        run: pnpm devnet:verify:offline

      - name: Check formatting, lint, and types
        run: pnpm check

      - name: Run tests with coverage gate
        run: pnpm test:coverage

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run fixture-backed dashboard browser suite
        run: pnpm test:e2e:dashboard

      - name: Run self-contained Epoch 4.0 lifecycle
        run: pnpm test:regtest

      - name: Build packages and applications
        run: pnpm build

      - name: Build production container
        run: docker build --target runtime --tag signer-sidekick:ci .

      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-test-evidence
          path: |
            coverage/
            test/e2e/devnet/playwright-report/
            test/e2e/devnet/test-results/
          if-no-files-found: ignore
          retention-days: 14
