name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Verify release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          version="${tag#v}"
          for manifest in \
            package.json \
            apps/sidekick/package.json \
            apps/dashboard/package.json \
            packages/api-contracts/package.json \
            packages/protocol/package.json; do
            manifest_version="$(jq -r .version "$manifest")"
            [[ "$manifest_version" == "$version" ]] || {
              echo "$manifest is version $manifest_version; release tag is $tag" >&2
              exit 1
            }
          done
          commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "Release tag must point to a commit on main" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm check
          pnpm test:coverage
          pnpm test:regtest

      - name: Run dashboard browser suite
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e:dashboard

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Prepare release image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ steps.release.outputs.version }}"
          reference="$image:$version"
          if docker manifest inspect "$reference" >/dev/null 2>&1; then
            echo "Image tag $reference already exists" >&2
            exit 1
          fi
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Publish release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            VCS_REF=${{ steps.release.outputs.commit }}
            VERSION=${{ steps.release.outputs.version }}
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          sbom: false
          tags: ${{ steps.image.outputs.reference }}
          target: runtime

      - name: Verify release image platforms
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect --raw "$IMAGE_REFERENCE")"
          for architecture in amd64 arm64; do
            jq -e --arg architecture "$architecture" \
              'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $architecture)' \
              <<<"$manifest" >/dev/null || {
                echo "$IMAGE_REFERENCE is missing linux/$architecture" >&2
                exit 1
              }
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$notes" ]]; then
            {
              printf 'Container image: `%s`\n\n' "$IMAGE_REFERENCE"
              cat "$notes"
            } > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Signer Sidekick $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Signer Sidekick $RELEASE_TAG" \
              --generate-notes \
              --notes "Container image: \`$IMAGE_REFERENCE\`"
          fi
