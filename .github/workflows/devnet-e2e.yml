name: Released Devnet E2E

# The weekly schedule is disabled because the suite cannot complete. The version
# lock now verifies, but Clarinet aborts before the Devnet starts: it gives
# bitcoind roughly 15 seconds to answer on localhost:18443 and then exits fatally.
# Nothing downstream of that has ever run. Restore the schedule below once a
# workflow_dispatch run passes end to end.
#
#  schedule:
#    - cron: "17 8 * * 1"
#
# See https://github.com/stx-labs/signer-sidekick/issues/3
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: released-devnet-e2e
  cancel-in-progress: false

jobs:
  released-devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify released version lock
        run: pnpm devnet:verify

      - name: Run released Devnet suite from genesis
        run: pnpm e2e:devnet:test

      - name: Clean up Devnet
        if: always()
        run: pnpm e2e:devnet:down

      - name: Upload Devnet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devnet-e2e-from-genesis
          path: |
            test/e2e/devnet/artifacts/
            test/e2e/devnet/playwright-report/
            test/e2e/devnet/test-results/
          if-no-files-found: warn
          retention-days: 30
